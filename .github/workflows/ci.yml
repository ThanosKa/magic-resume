name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No `version` input: pnpm is read from the `packageManager` field in
      # package.json, so local and CI use the same pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 24: the Worker build and `cf` need it (24.22 or newer).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build (Next)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # The build that goes live. A change can pass the Next build and still
      # break the vinext/Worker build. The build refuses a missing or non-https
      # NEXT_PUBLIC_SITE_URL (lib/public-env.ts).
      - name: Build (Worker)
        run: pnpm build:vinext
        env:
          CLOUDFLARE_VITE_FORCE_LOCAL: 'true'
          NEXT_PUBLIC_SITE_URL: https://magik-resume.dev

      - name: Test
        run: pnpm test
